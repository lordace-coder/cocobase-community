<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <!--
        CUSTOM PASSWORD RESET PAGE EXAMPLE

        Use this template if you want to host your own password reset page
        instead of using the default Cocobase-hosted page.

        To use:
        1. Customize this page to match your brand
        2. Host it on your domain (e.g., https://yourapp.com/reset-password)
        3. Update your project config:
           project.configs["PASSWORD_RESET_URL"] = "https://yourapp.com/reset-password"
        4. Replace 'YOUR_PROJECT_API_KEY' below with your actual API key
    -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .button {
            width: 100%;
            padding: 12px;
            background-color: #4F46E5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .button:hover {
            background-color: #4338CA;
        }
        .message {
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        .success { background-color: #D1FAE5; border-left: 4px solid #10B981; }
        .error { background-color: #FEE2E2; border-left: 4px solid #DC2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Your Password</h1>
        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="Enter new password" required>
            <button onclick="resetPassword()">Reset Password</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            alert('Invalid reset link');
        }

        async function resetPassword() {
            const newPassword = document.getElementById('new-password').value;

            const response = await fetch('https://api.cocobase.buzz/auth-collections/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': 'YOUR_PROJECT_API_KEY'  // Replace with your actual API key
                },
                body: JSON.stringify({
                    token: token,
                    new_password: newPassword
                })
            });

            if (response.ok) {
                alert('Password reset successfully!');
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
