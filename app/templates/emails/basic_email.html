<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Cocobase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            background: linear-gradient(135deg, #ff7a45 0%, #ff6b35 100%);
            padding: 40px 30px;
            text-align: center;
        }
        .logo {
            max-width: 180px;
            height: auto;
            margin: 0 auto 10px;
            display: block;
        }
        .header-text {
            color: #ffffff;
            font-size: 18px;
            opacity: 0.95;
        }
        .content {
            padding: 40px 30px;
        }
        h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
        }
        .message {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .footer {
            background-color: #f9fafb;
            padding: 30px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }
        .footer a {
            color: #ff7a45;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <img src="https://www.cocobase.buzz/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Flogo.e4c068de.png&w=640&q=75" alt="Cocobase Logo" class="logo">
            <div class="header-text">{{title}}</div>
        </div>
        
        <div class="content">
            <div class="message">{{message}}</div>
        </div>
        
        <div class="footer">
            <p><strong>Cocobase</strong> - Your Backend as a Service</p>
            <p style="margin-top: 10px;">
                <a href="https://www.cocobase.buzz/privacy-policy">Privacy Policy</a> • 
                <a href="https://www.cocobase.buzz/terms-of-service">Terms of Service</a> • 
                <a href="mailto:support@cocobase.buzz">Support</a>
            </p>
            <p style="margin-top: 15px; font-size: 13px;">
                © 2026 Cocobase. All rights reserved.<br>
                This is an automated email, please do not reply to this message.
            </p>
        </div>
    </div>
</body>
</html>
