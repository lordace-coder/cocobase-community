<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - {{app_name}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: bold;
            color: #4F46E5;
        }

        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }

        .button {
            width: 100%;
            padding: 14px;
            background-color: #4F46E5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .button:hover {
            background-color: #4338CA;
        }

        .button:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .success {
            background-color: #D1FAE5;
            color: #065F46;
            border-left: 4px solid #10B981;
        }

        .error {
            background-color: #FEE2E2;
            color: #991B1B;
            border-left: 4px solid #DC2626;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .footer a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .cocobase-tagline {
            font-size: 11px;
            color: #9CA3AF;
            margin-top: 5px;
        }

        .show-password {
            display: flex;
            align-items: center;
            margin-top: 8px;
            font-size: 14px;
            color: #374151;
            cursor: pointer;
            user-select: none;
        }

        .show-password input {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-text">{{app_name}}</div>
        </div>

        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter your new password below</p>

        <div id="message" class="message"></div>

        <form id="resetForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input
                    type="password"
                    id="new-password"
                    name="new-password"
                    required
                    minlength="8"
                    placeholder="Enter new password"
                >
                <p class="password-requirements">Must be at least 8 characters long</p>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    required
                    minlength="8"
                    placeholder="Confirm new password"
                >
            </div>

            <label class="show-password">
                <input type="checkbox" id="show-password-toggle" onchange="togglePasswordVisibility()">
                Show passwords
            </label>

            <button type="submit" class="button" id="submit-btn">
                Reset Password
            </button>
        </form>

        <div class="footer">
            <p>Powered by <a href="https://cocobase.buzz" target="_blank">Cocobase</a></p>
            <p class="cocobase-tagline">Backend-as-a-Service • Build Apps Faster</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const apiKey = '{{api_key}}';

        if (!token) {
            showMessage('Invalid or missing reset token. Please request a new password reset link.', 'error');
            document.getElementById('submit-btn').disabled = true;
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;
        }

        function togglePasswordVisibility() {
            const newPassword = document.getElementById('new-password');
            const confirmPassword = document.getElementById('confirm-password');
            const isChecked = document.getElementById('show-password-toggle').checked;

            newPassword.type = isChecked ? 'text' : 'password';
            confirmPassword.type = isChecked ? 'text' : 'password';
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const submitBtn = document.getElementById('submit-btn');

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match. Please try again.', 'error');
                return;
            }

            // Validate password length
            if (newPassword.length < 8) {
                showMessage('Password must be at least 8 characters long.', 'error');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Resetting password...';

            try {
                const response = await fetch('/auth-collections/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Password reset successfully! Redirecting...', 'success');
                    document.getElementById('resetForm').style.display = 'none';

                    // Redirect after 2 seconds
                    setTimeout(() => {
                        // Try to redirect to login page if configured, otherwise show success
                        const loginUrl = '{{login_url}}' || null;
                        if (loginUrl && loginUrl !== 'None') {
                            window.location.href = loginUrl;
                        } else {
                            showMessage('Password reset successfully! You can now close this page and log in.', 'success');
                        }
                    }, 2000);
                } else {
                    showMessage(data.detail || 'Failed to reset password. The link may have expired.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please try again later.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        }
    </script>
</body>
</html>
